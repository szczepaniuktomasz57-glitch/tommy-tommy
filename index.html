<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOMMY TOMMY - Global Talent Live Streaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-white font-sans antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-2">
            <span class="text-2xl font-black text-red-500 tracking-wider">TOMMY<span class="text-amber-400">TOMMY</span></span>
        </div>
        <div class="text-sm bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700 flex items-center space-x-2">
            <span>🌐 Global (IT/EN/ES)</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 pb-24">
        <!-- Talent Categories -->
        <section class="mb-6">
            <h2 class="text-xs uppercase font-semibold text-slate-400 mb-3 tracking-wider">Categorie di Talenti</h2>
            <div class="grid grid-cols-4 gap-3 text-center">
                <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl">
                    <div class="text-2xl mb-1">💃</div>
                    <span class="text-xs text-slate-300">Dance</span>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl">
                    <div class="text-2xl mb-1">🎤</div>
                    <span class="text-xs text-slate-300">Singing</span>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl">
                    <div class="text-2xl mb-1">🤹</div>
                    <span class="text-xs text-slate-300">Juggling</span>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl">
                    <div class="text-2xl mb-1">🎧</div>
                    <span class="text-xs text-slate-300">DJ</span>
                </div>
            </div>
        </section>

        <!-- Post Form -->
        <section class="bg-slate-900 border border-slate-800 p-4 rounded-2xl mb-6 shadow-xl">
            <h3 class="text-sm font-bold text-amber-400 mb-3">Pubblica la tua performance</h3>
            <form id="post-form" class="space-y-3">
                <textarea id="post-content" rows="3" placeholder="Racconta il tuo talento..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-red-500"></textarea>
                <select id="post-category" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-red-500">
                    <option value="Dance">Dance</option>
                    <option value="Singing">Singing</option>
                    <option value="Juggling">Juggling</option>
                    <option value="DJ Mixing">DJ Mixing</option>
                </select>
                <button type="submit" class="w-full bg-gradient-to-r from-red-600 to-amber-500 text-white font-bold py-3 rounded-xl text-sm shadow-lg">Condividi sulla Scena Globale</button>
            </form>
        </section>

        <!-- Live Feed -->
        <section>
            <h3 class="text-xs uppercase font-semibold text-slate-400 mb-3 tracking-wider">Feed in Tempo Reale</h3>
            <div id="posts-container" class="space-y-4">
                <div class="text-center text-slate-500 py-6 text-sm">Caricamento talenti...</div>
            </div>
        </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bg-slate-900 border-t border-slate-800 fixed bottom-0 left-0 right-0 py-2 px-6 flex justify-between items-center z-50">
        <div class="flex flex-col items-center text-red-500">
            <span class="text-lg">🏠</span>
            <span class="text-[10px]">Home</span>
        </div>
        <div class="flex flex-col items-center text-slate-400">
            <span class="text-lg">🔍</span>
            <span class="text-[10px]">Explore</span>
        </div>
        <div class="flex flex-col items-center text-amber-400 -mt-6 bg-red-600 p-3 rounded-full shadow-lg border-4 border-slate-900">
            <span class="text-xl">🔴</span>
        </div>
        <div class="flex flex-col items-center text-slate-400">
            <span class="text-lg">💬</span>
            <span class="text-[10px]">Messages</span>
        </div>
        <div class="flex flex-col items-center text-slate-400">
            <span class="text-lg">👤</span>
            <span class="text-[10px]">Profile</span>
        </div>
    </nav>

    <!-- Supabase Script -->
    <script>
        const SUPABASE_URL = 'https://rwwopcgmodfkyujbons.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ3d29wY2dtb2Rma3l1amJvbnMiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTczMTQzNzc0MSwiZXhwIjoyMDQ3MDEzNzQxfQ.placeholder'; // Twój klucz publiczny

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchPosts() {
            const container = document.getElementById('posts-container');
            const { data, error } = await supabaseClient.from('Posts').select('*').order('id', { ascending: false });
            
            if (error) {
                container.innerHTML = `<div class="text-center text-red-500 text-sm">Errore: ${error.message}</div>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-500 text-sm py-6">Nessun post ancora. Pubblica qualcosa!</div>`;
                return;
            }

            container.innerHTML = data.map(post => `
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs bg-amber-400/10 text-amber-400 px-2 py-0.5 rounded-full font-semibold">${post.categoria || 'Generale'}</span>
                        <span class="text-[10px] text-slate-500">${new Date(post.created_at || Date.now()).toLocaleTimeString()}</span>
                    </div>
                    <p class="text-sm text-slate-200">${post.Contenuto || ''}</p>
                </div>
            `).join('');
        }

        document.getElementById('post-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const Contenuto = document.getElementById('post-content').value;
            const categoria = document.getElementById('post-category').value;

            if (!Contenuto.trim()) return;

            const { error } = await supabaseClient.from('Posts').insert([{ Contenuto, categoria }]);
            
            if (error) {
                alert('Errore: ' + error.message);
            } else {
                document.getElementById('post-content').value = '';
                fetchPosts();
            }
        });

        fetchPosts();
    </script>
</body>
                      </html>
